# Surveillance publique de festisyn.com (13 novembre 2026, demande de l'utilisateur : « créer une surveillance avec
# https://festisyn.com/healthz que tout le monde peut consulter »). /healthz lit la base : une panne du serveur ou de la
# base répond autre chose que 200. Testé toutes les 5 minutes (le plus court que permet GitHub Actions).
owner: lycantyr
repo: festisyn-statut
user-agent: lycantyr

sites:
  - name: festisyn.com
    url: https://festisyn.com/healthz
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
    icon: https://raw.githubusercontent.com/lycantyr/festisyn-statut/master/assets/festisyn.png

# Chaque panne ouvre un ticket assigné au propriétaire : GitHub l'en prévient par e-mail.
assignees:
  - lycantyr

status-website:
  baseUrl: /festisyn-statut
  name: État de Festisyn
  logoUrl: https://raw.githubusercontent.com/lycantyr/festisyn-statut/master/assets/festisyn.png
  favicon: https://raw.githubusercontent.com/lycantyr/festisyn-statut/master/assets/festisyn.png
  introTitle: "**festisyn.com** est-il en ligne ?"
  introMessage: "Le site [festisyn.com](https://festisyn.com) est testé toutes les 5 minutes depuis les serveurs de GitHub. Chaque panne ouvre un incident sur cette page, refermé au retour du site."
  navbar:
    - title: État
      href: /
    - title: festisyn.com
      href: https://festisyn.com
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

